<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <linearGradient id="aguraGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E11D48"/>
      <stop offset="50%" stop-color="#F43F5E"/>
      <stop offset="100%" stop-color="#FB7185"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#FBBF24"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="120" fill="#FFFFFF"/>
  <circle cx="120" cy="120" r="114" fill="#FFF1F2" stroke="#F43F5E" stroke-width="4"/>
  
  <!-- Metallic Foil Balloons Emblem -->
  <g transform="translate(120, 85)">
    <!-- Side balloons -->
    <path d="M-36,-10 C-50,-24 -50,-52 -32,-62 C-16,-72 4,-58 -4,-38 C-8,-26 -22,-14 -32,-8 L-34,-3 L-38,-3 Z" fill="url(#goldGrad)" opacity="0.9"/>
    <path d="M36,-10 C50,-24 50,-52 32,-62 C16,-72 -4,-58 4,-38 C8,-26 22,-14 32,-8 L34,-3 L38,-3 Z" fill="url(#goldGrad)" opacity="0.9"/>
    
    <!-- Central Heart / Star Foil Balloon -->
    <path d="M0,8 C-36,-22 -52,-54 -30,-72 C-12,-85 0,-62 0,-50 C0,-62 12,-85 30,-72 C52,-54 36,-22 0,8 Z" fill="url(#aguraGrad)"/>
    <!-- Specular highlight on balloon -->
    <ellipse cx="-12" cy="-56" rx="8" ry="14" transform="rotate(-25 -12 -56)" fill="#FFFFFF" opacity="0.5"/>
    <!-- Balloon tie -->
    <polygon points="-5,10 5,10 0,16" fill="#BE123C"/>
  </g>
  
  <!-- AGURA Typography -->
  <text x="120" y="166" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-weight="900" font-size="34" fill="#BE123C" letter-spacing="3">
    AGURA
  </text>
  <text x="120" y="188" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-weight="700" font-size="9" fill="#881337" letter-spacing="2">
    BALLOONS FACTORY
  </text>
</svg>
