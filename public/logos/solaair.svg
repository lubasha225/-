<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <linearGradient id="solaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <radialGradient id="sparkleGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#A5F3FC"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="240" height="240" rx="120" fill="#0F172A"/>
  
  <!-- Shimmering Sequin Pattern in Center Circle -->
  <g transform="translate(120, 92)">
    <!-- Sequin disks in radial dynamic arrangement -->
    <circle cx="-38" cy="-22" r="14" fill="url(#solaGrad)" opacity="0.9"/>
    <circle cx="0" cy="-35" r="15" fill="#38BDF8" opacity="0.95"/>
    <circle cx="38" cy="-22" r="14" fill="url(#solaGrad)" opacity="0.9"/>
    
    <circle cx="-45" cy="15" r="15" fill="#0EA5E9"/>
    <circle cx="0" cy="5" r="18" fill="url(#solaGrad)"/>
    <circle cx="45" cy="15" r="15" fill="#6366F1"/>
    
    <circle cx="-25" cy="42" r="13" fill="#38BDF8" opacity="0.85"/>
    <circle cx="25" cy="42" r="13" fill="#818CF8" opacity="0.85"/>
    
    <!-- Central holographic gleam star -->
    <path d="M 0,-15 Q 0,0 -15,0 Q 0,0 0,15 Q 0,0 15,0 Q 0,0 0,-15 Z" fill="#FFFFFF"/>
    <circle cx="0" cy="0" r="4" fill="#FFFFFF"/>
  </g>
  
  <!-- SolaAir typography -->
  <text x="120" y="180" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="28" fill="#FFFFFF" letter-spacing="1">
    Sola<tspan fill="#38BDF8">Air</tspan>
  </text>
  <text x="120" y="202" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="9" fill="#94A3B8" letter-spacing="3">
    SEQUIN TECHNOLOGY
  </text>
</svg>
