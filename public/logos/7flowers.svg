<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <linearGradient id="flowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="120" fill="#F0FDF4"/>
  <circle cx="120" cy="120" r="114" fill="#FFFFFF" stroke="#10B981" stroke-width="4"/>
  
  <!-- Flower Petals Emblem -->
  <g transform="translate(120, 85)">
    <!-- 7 Petals around center -->
    <circle cx="0" cy="-28" r="14" fill="#10B981" opacity="0.85"/>
    <circle cx="24" cy="-14" r="14" fill="#059669" opacity="0.85"/>
    <circle cx="24" cy="16" r="14" fill="#10B981" opacity="0.85"/>
    <circle cx="0" cy="28" r="14" fill="#047857" opacity="0.85"/>
    <circle cx="-24" cy="16" r="14" fill="#10B981" opacity="0.85"/>
    <circle cx="-24" cy="-14" r="14" fill="#059669" opacity="0.85"/>
    <!-- Center Core with "7" -->
    <circle cx="0" cy="0" r="18" fill="#F59E0B"/>
    <text x="0" y="7" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="20" fill="#FFFFFF">7</text>
  </g>
  
  <!-- 7FLOWERS Typography -->
  <text x="120" y="165" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="28" fill="#065F46" letter-spacing="1">
    7ЦВЕТОВ
  </text>
  <text x="120" y="186" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="9" fill="#047857" letter-spacing="2">
    FLOWER LOGISTICS
  </text>
</svg>
